<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="أعمال ومشاريع Mohammed Alhamad.">
<title>Mohammed Alhamad — أعمالي</title>
<link rel="preload" href="assets/ts-zunburk.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Zunburk;src:url('assets/ts-zunburk.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--ink:#f0efec;--paper:#202122;--bar:#2b2c2e;--muted:#b1b2b4;--line:#424446;--radius:68px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Zunburk,Arial,sans-serif;font-size:15px}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #275eee;outline-offset:5px}button{border:0}p{line-height:1.9;margin:0}h1,h2,h3{margin:0;font-weight:700}a:hover{text-decoration:underline;text-underline-offset:5px}.latin{font-family:Arial,sans-serif;direction:ltr;display:inline-block}.shell{padding:16px;max-width:1800px;margin:0 auto}.top{background:var(--bar);border-radius:40px;padding:11px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:49px}.name{font-size:21px}.role{font-size:13px}.menus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;position:relative;z-index:5}.menu{position:relative}summary{background:var(--bar);border-radius:30px;padding:12px 24px;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:15px}summary::-webkit-details-marker{display:none}.arrow{width:0;height:0;border-right:5px solid transparent;border-left:5px solid transparent;border-top:6px solid #c6c6c6;transition:transform .2s}details[open] .arrow{transform:rotate(180deg);border-top-color:#171717}.menu-content{position:absolute;top:58px;right:0;left:0;border-radius:24px;background:#f6f6f6;padding:28px 24px;box-shadow:0 12px 18px #00000008}.list-head,.list-row{display:grid;grid-template-columns:30px 1fr 100px;gap:15px;align-items:center}.list-head{font-size:11px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}.list-row{padding-top:16px;font-size:14px}.list-row .latin{font-size:12px}.about-text{max-width:540px;font-size:15px;margin-bottom:24px}.about-label{font-size:11px;color:var(--muted);margin:18px 0 8px}.contact-list{display:flex;gap:24px;flex-wrap:wrap;font-size:13px}.placeholder-link{color:var(--muted)}
.intro{height:clamp(200px,29vh,340px);display:flex;align-items:end;padding:0 24px 30px;justify-content:space-between;gap:20px}.intro h1{font-size:18px;font-weight:500;line-height:1.8}.intro .count{font-size:12px;color:var(--muted)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.project{min-width:0}.project-button{padding:0;background:none;width:100%;display:block;text-align:inherit}.visual{height:clamp(330px,46vw,720px);border-radius:var(--radius);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.caption{display:flex;justify-content:space-between;gap:20px;padding:15px 20px 27px;align-items:baseline}.caption h2{font-size:17px}.caption span{font-size:12px;color:var(--muted)}.cluvaro{background:#123dff;color:white;isolation:isolate}.cluvaro:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 63px,#ffffff12 63px 64px),repeating-linear-gradient(90deg,transparent 0 63px,#ffffff12 63px 64px);mask-image:linear-gradient(#000,transparent)}.wordmark{font-family:Arial,sans-serif;font-size:clamp(38px,6.1vw,105px);font-weight:900;letter-spacing:-.07em;direction:ltr;position:absolute;top:11%;right:9%;left:9%;text-align:center}.game-object{position:absolute;width:45%;aspect-ratio:1;top:34%;border:clamp(20px,4.5vw,72px) solid #c6ff67;border-radius:26%;transform:rotate(-23deg);box-shadow:24px 28px 0 #0620a1;transition:transform .55s cubic-bezier(.2,.7,.2,1)}.game-object:after{content:'';position:absolute;inset:12%;border-radius:15%;background:#faffed}.project-button:hover .game-object{transform:rotate(-12deg) translateY(-8px)}.visual-meta{position:absolute;bottom:7%;right:9%;left:9%;display:flex;justify-content:space-between;font-size:12px}.visual-meta span{font-family:Arial,sans-serif}.placeholder-visual{background:#efefed;color:#292929}.placeholder-visual .outline{width:46%;height:59%;border:1px solid #c9c9c3;border-radius:28px;display:flex;align-items:center;justify-content:center;position:relative;transform:rotate(9deg)}.outline:after{content:'';position:absolute;inset:12px;border:1px solid #d4d4ce;border-radius:20px}.outline span{font-size:55px;color:#bbb;line-height:1}.placeholder-note{position:absolute;bottom:8%;font-size:14px;color:#888}.next{font-size:12px;color:#aaa;position:absolute;top:8%;right:9%}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:60px 24px 24px;font-size:12px;color:var(--muted)}.footer .contacts{display:flex;gap:25px}.project-details{border:0;border-radius:32px;padding:0;max-width:630px;width:calc(100% - 32px);background:white;color:var(--ink);box-shadow:0 20px 100px #0002}.project-details::backdrop{background:#0005;backdrop-filter:blur(5px)}.dialog-body{padding:35px}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.dialog-top h2{font-size:29px}.close{background:#f3f3f3;width:38px;height:38px;border-radius:50%;font-family:Arial;font-size:24px}.dialog-body p{font-size:16px}.detail-label{font-size:12px;color:var(--muted);margin-top:25px}.dialog-body .note{font-size:12px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
@media(min-width:1400px){.intro{height:360px}.visual{height:710px}}@media(max-width:700px){:root{--radius:42px}.shell{padding:10px}.top{padding:9px 18px;gap:12px}.name{font-size:20px}.role{font-size:11px}.menus{gap:8px;margin-top:8px}summary{padding:10px 18px;font-size:14px}.menu-content{padding:20px 18px;position:fixed;top:130px;right:10px;left:10px;max-height:65vh;overflow:auto}.intro{height:180px;padding:0 16px 25px}.intro h1{font-size:16px}.intro .count{font-size:10px}.gallery{gap:25px;grid-template-columns:1fr}.visual{height:112vw;max-height:610px}.wordmark{font-size:11vw}.game-object{border-width:9vw;box-shadow:18px 22px 0 #0620a1}.caption{padding:12px 16px 5px}.caption h2{font-size:17px}.footer{padding:45px 16px 15px;align-items:start;flex-direction:column;gap:15px}.dialog-body{padding:25px}.dialog-top h2{font-size:25px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
/* لوحة فحمية، بما فيها القوائم ونافذة تفاصيل المشروع. */
.menu-content{background:var(--bar);box-shadow:0 12px 24px #0003}
.arrow{border-top-color:#96989b}details[open] .arrow{border-top-color:var(--ink)}
.placeholder-visual{background:#303234;color:var(--ink)}
.placeholder-visual .outline{border-color:#66696c}.outline:after{border-color:#505356}
.outline span{color:#b1b2b4}.placeholder-note,.next{color:var(--muted)}
.project-details{background:var(--bar);box-shadow:0 20px 100px #0006}
.project-details::backdrop{background:#0009}.close{background:#404245;color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline-color:#a6c0ff}
.name{font-family:Arial,sans-serif;direction:ltr;font-weight:700;font-size:20px}
.project-cover-title{font-size:clamp(34px,4.5vw,72px);line-height:1.4;text-align:center;padding:30px;overflow-wrap:anywhere}
.project-cover-title.latin{letter-spacing:-.04em;font-weight:700}
.visual-image{height:100%;width:100%;object-fit:cover}
.caption h2{unicode-bidi:plaintext}.list-row .project-label{unicode-bidi:plaintext}
.list-head,.list-row{grid-template-columns:30px 1fr}
@media(max-width:700px){.name{font-size:18px}.project-cover-title{font-size:10vw}}
</style>
</head>
<body>
<!-- تعديل بياناتك: غيّر القيم في SITE أسفل الملف. استبدل الغلاف التجريبي بصورة لعبتك عند توفرها. -->
<div class="shell">
<header class="top"><a class="name" href="#" data-name>Mohammed Alhamad</a></header>
<nav class="menus" aria-label="قائمة الموقع">
<details class="menu"><summary>الأعمال<span class="arrow" aria-hidden="true"></span></summary><div class="menu-content"><div class="list-head"><span>#</span><span>المشروع</span></div><div id="project-list"></div></div></details>
<details class="menu"><summary>عني<span class="arrow" aria-hidden="true"></span></summary><div class="menu-content"><p class="about-text" data-bio>أنا Mohammed Alhamad. هنا أجمع أعمالي ومشاريعي الشخصية.</p><div class="about-label">تواصل</div><div class="contact-list"><span data-email><a href="mailto:alhamad.84m@gmail.com" dir="ltr">alhamad.84m@gmail.com</a></span></div></div></details>
</nav>
<main>
<section class="intro" aria-label="مقدمة"><h1>أعمالي ومشاريعي.</h1><span class="count" id="project-count">٥ مشاريع</span></section>
<section class="gallery" id="project-gallery" aria-label="معرض الأعمال"></section>
</main>
<footer class="footer"><div class="contacts"><span data-email><a href="mailto:alhamad.84m@gmail.com" dir="ltr">alhamad.84m@gmail.com</a></span></div><span>© <span id="year"></span> <bdi data-name>Mohammed Alhamad</bdi></span></footer>
</div>
<dialog class="project-details" id="project-dialog" aria-labelledby="project-title"><div class="dialog-body"><div class="dialog-top"><h2 id="project-title"></h2><button class="close" id="close-project" type="button" aria-label="إغلاق">×</button></div><p id="project-description"></p><div class="detail-label" id="project-link-slot"></div><p class="note" id="project-note"></p></div></dialog>
<script>
// بيانات الصفحة. بيانات المشاريع في PROJECTS: أضف الوصف ومسار الصورة والرابط عندما تتوفر.
const SITE = {
  name: 'Mohammed Alhamad',
  bio: 'أنا Mohammed Alhamad. هنا أجمع أعمالي ومشاريعي الشخصية.',
  email: 'alhamad.84m@gmail.com'
};
const PROJECTS = [
  { id:'cluvaro', name:'CLUVARO', coverTitle:'CLUVARO', latin:true, type:'لعبة / Unity', description:'لعبة للهواتف مبنية باستخدام Unity.', image:'assets/cluvaro-cover.png', url:'' },
  { id:'tawi', name:'طَوي | Tawi', coverTitle:'طَوي', latin:false, type:'', description:'', image:'assets/tawi-cover.png', url:'' },
  { id:'molista', name:'موليستا | Molista', coverTitle:'موليستا', latin:false, type:'', description:'', image:'assets/molista-cover.png', url:'https://play.google.com/store/apps/details?id=com.molista.molista' },
  { id:'testerrelay', name:'TesterRelay', coverTitle:'TesterRelay', latin:true, type:'', description:'', image:'assets/testerrelay-cover.png', url:'' },
  { id:'fasl', name:'تطبيق فصل', coverTitle:'فصل', latin:false, type:'', description:'', image:'assets/fasl-cover.png', url:'https://play.google.com/store/apps/details?id=com.fasl.app' }
];
document.querySelectorAll('[data-name]').forEach(el=>el.textContent=SITE.name);
document.querySelector('[data-bio]').textContent=SITE.bio;
document.title=SITE.name+' — أعمالي';
function insertLink(selector,value,label,prefix=''){
  if(!value)return;
  document.querySelectorAll(selector).forEach(el=>{const a=document.createElement('a');a.href=prefix+value;a.textContent=label||value;a.dir='ltr';el.replaceChildren(a);el.classList.remove('placeholder-link')});
}
insertLink('[data-email]',SITE.email,SITE.email,'mailto:');
const dialog=document.getElementById('project-dialog');
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function openProject(project){
  const title=document.getElementById('project-title');title.textContent=project.name;title.className=project.latin?'latin':'';title.dir='auto';
  document.getElementById('project-description').textContent=project.description||'تفاصيل المشروع تُضاف لاحقًا.';
  const slot=document.getElementById('project-link-slot');slot.replaceChildren();
  if(project.url){const link=element('a','',project.url.startsWith('https://play.google.com/store/apps/details?')?'تحميل من Google Play ↗':'زيارة المشروع ↗');link.href=project.url;link.target='_blank';link.rel='noopener noreferrer';slot.append(link)}
  const note=document.getElementById('project-note');note.textContent=project.image?'':'الغلاف الحالي مؤقت، ويُستبدل بصورة المشروع لاحقًا.';note.hidden=!!project.image;
  dialog.showModal();
}
PROJECTS.forEach((project,index)=>{
  const number=String(index+1).padStart(2,'0');
  const row=element('a','list-row');row.href='#'+project.id;row.append(element('span','latin',number),element('span','project-label',project.name));row.addEventListener('click',()=>document.querySelectorAll('details').forEach(menu=>menu.open=false));document.getElementById('project-list').append(row);
  const card=element('article','project');card.id=project.id;
  const button=element('button','project-button');button.type='button';button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-label','عرض تفاصيل '+project.name);
  const visual=element('div','visual '+(project.id==='cluvaro'?'cluvaro':'placeholder-visual'));
  if(project.image){const img=element('img','visual-image');img.src=project.image;img.alt=project.name;img.loading='lazy';visual.append(img)}
  else if(project.id==='cluvaro'){visual.append(element('span','wordmark',project.coverTitle));const shape=element('div','game-object');shape.setAttribute('aria-hidden','true');visual.append(shape)}
  else{visual.append(element('span','project-cover-title'+(project.latin?' latin':''),project.coverTitle))}
  if(!project.image){const meta=element('div','visual-meta');meta.append(element('span','',project.id==='cluvaro'?'MOBILE GAME':'PROJECT'),element('span','',number+' ↗'));visual.append(meta)}
  const caption=element('div','caption');const title=element('h2',project.latin?'latin':'',project.name);title.dir='auto';caption.append(title,element('span','',project.type?project.type+' ↗':'↗'));
  button.append(visual,caption);button.addEventListener('click',()=>openProject(project));card.append(button);document.getElementById('project-gallery').append(card);
});
document.getElementById('project-count').textContent=PROJECTS.length.toLocaleString('ar')+' مشاريع';
document.getElementById('year').textContent=new Date().getFullYear();
const menus=[...document.querySelectorAll('details')];
menus.forEach(menu=>menu.addEventListener('toggle',()=>{if(menu.open)menus.forEach(other=>{if(other!==menu)other.open=false})}));
document.addEventListener('click',event=>{if(!event.target.closest('.menus'))menus.forEach(menu=>menu.open=false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape')menus.forEach(menu=>menu.open=false)});
document.getElementById('close-project').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
</script>
</body></html>

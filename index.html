<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alhamad Apps</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    p {
      color: #666;
      line-height: 1.7;
    }

    .apps {
      margin-top: 40px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    a {
      color: #0b8f8f;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 50px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Alhamad Apps</h1>

    <p>
      Official developer website for our mobile applications and games.
    </p>

    <div class="apps">

      <div class="card">
        <h2>CLUVARO</h2>
        <p>
          A word puzzle game about discovering hidden connections between words.
        </p>

        <a href="/cluvaro/">
          Learn more
        </a>
      </div>

    </div>

    <footer>
      © 2026 Alhamad Apps
    </footer>

  </div>

</body>
</html>
